# DeepSeek MoE配置
# 参考DeepSeek-V2/V3模型配置

model:
  # 专家数量
  num_experts: 64
  # 每个token激活的专家数
  num_experts_per_tok: 6
  # 模型维度
  hidden_size: 4096
  # FFN中间维度
  intermediate_size: 14336
  
benchmark:
  # batch sizes to test
  batch_sizes: [1, 2, 4, 8, 16, 32]
  # sequence lengths
  seq_lengths: [512, 1024, 2048, 4096]
  # 预热次数
  warmup_iters: 10
  # 测试次数
  test_iters: 100
  
device:
  cuda_device: 0
